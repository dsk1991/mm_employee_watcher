<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MM Employee Watcher — Live Dashboard</title>
<meta http-equiv="refresh-not-used" content="">
<style>
	:root {
		--bg: #0f1115;
		--card-bg: #1a1d24;
		--text: #f2f3f5;
		--muted: #9aa0ab;
		--working: #22c55e;
		--idle: #6b7280;
		--break: #3b82f6;
		--blocked: #ef4444;
		--offline: #374151;
	}
	* { box-sizing: border-box; }
	body {
		margin: 0;
		background: var(--bg);
		color: var(--text);
		font-family: "Segoe UI", Roboto, -apple-system, Arial, sans-serif;
		min-height: 100vh;
	}
	header {
		display: flex;
		align-items: center;
		justify-content: space-between;
		padding: 13px 24px;
		border-bottom: 2px solid #262a33;
	}
	header h1 {
		margin: 0;
		font-size: 1.2rem;
		letter-spacing: 0.5px;
	}
	header .clock {
		font-size: 1.1rem;
		color: var(--muted);
		font-variant-numeric: tabular-nums;
	}
	.counts {
		display: flex;
		gap: 14px;
		padding: 16px 32px 0;
		flex-wrap: wrap;
	}
	.pill {
		padding: 8px 18px;
		border-radius: 999px;
		font-weight: 600;
		font-size: 1rem;
	}
	.grid {
		display: grid;
		grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
		gap: 12px;
		padding: 18px 24px 40px;
	}
	.card {
		background: var(--card-bg);
		border-radius: 10px;
		padding: 11px 13px;
		border-left: 5px solid var(--idle);
		box-shadow: 0 2px 8px rgba(0,0,0,0.32);
		font-size: 0.85rem;
	}
	.card.WORKING { border-left-color: var(--working); }
	.card.IDLE { border-left-color: var(--idle); }
	.card.BREAK { border-left-color: var(--break); }
	.card.BLOCKED { border-left-color: var(--blocked); }
	.card.OFFLINE, .card.OFFDUTY { border-left-color: var(--offline); }

	.card .top {
		display: flex;
		justify-content: space-between;
		align-items: baseline;
		margin-bottom: 6px;
	}
	.card .name {
		font-size: 1rem;
		font-weight: 700;
	}
	.card .status {
		font-size: 0.68rem;
		font-weight: 700;
		letter-spacing: 0.5px;
		padding: 2px 7px;
		border-radius: 5px;
		text-transform: uppercase;
	}
	.card .livetimer {
		font-variant-numeric: tabular-nums;
		font-weight: 700;
		font-size: 1.15rem;
		margin: 4px 0 2px;
	}
	.card .livetimer.over { color: var(--blocked); }
	.card .viewbtn {
		margin-top: 9px;
		background: rgba(255,255,255,0.08);
		color: var(--text);
		border: 1px solid rgba(255,255,255,0.16);
		border-radius: 6px;
		padding: 3px 12px;
		font-size: 0.75rem;
		cursor: pointer;
	}
	.card .viewbtn:hover { background: rgba(255,255,255,0.16); }
	.card.WORKING .status { background: rgba(34,197,94,0.18); color: var(--working); }
	.card.IDLE .status { background: rgba(107,114,128,0.25); color: #d1d5db; }
	.card.BREAK .status { background: rgba(59,130,246,0.18); color: var(--break); }
	.card.BLOCKED .status { background: rgba(239,68,68,0.18); color: var(--blocked); }
	.card.OFFLINE .status, .card.OFFDUTY .status { background: rgba(55,65,81,0.4); color: var(--muted); }

	.card .work {
		font-size: 0.92rem;
		font-weight: 600;
		margin: 6px 0 2px;
	}
	.card .desc {
		color: var(--muted);
		font-size: 0.8rem;
		margin: 2px 0 4px;
	}
	.card .activity-counts {
		color: var(--muted);
		font-size: 0.75rem;
		margin-top: 6px;
	}
	.card .qty {
		color: var(--muted);
		font-size: 0.8rem;
	}
	.card .footline {
		margin-top: 6px;
		font-size: 0.78rem;
		color: var(--muted);
		display: flex;
		justify-content: space-between;
	}
	.card .footline .warn { color: #fbbf24; font-weight: 600; }
	.card .footline .over { color: var(--blocked); font-weight: 700; }
	.card .reason {
		margin-top: 8px;
		font-size: 0.9rem;
		color: #fca5a5;
	}
	.empty {
		padding: 60px 32px;
		text-align: center;
		color: var(--muted);
		font-size: 1.2rem;
	}
	.card { cursor: pointer; transition: transform .08s ease; }
	.card:hover { transform: translateY(-2px); }
	.overlay {
		position: fixed; inset: 0; background: rgba(0,0,0,.62);
		display: none; z-index: 60; padding: 24px;
	}
	.overlay.show { display: flex; }
	.modal {
		background: var(--card-bg); margin: auto; width: min(920px, 96vw);
		max-height: 88vh; overflow-y: auto; border-radius: 14px;
		padding: 22px 26px; box-shadow: 0 20px 60px rgba(0,0,0,.55);
	}
	.modal .close { float: right; cursor: pointer; font-size: 1.7rem; color: var(--muted); line-height: 1; }
	.modal h2 { margin: 0 0 4px; }
	.modal .sub { color: var(--muted); margin-bottom: 14px; }
	.modal .sec-title { font-size: 1rem; font-weight: 700; margin: 18px 0 6px; }
	.modal table { width: 100%; border-collapse: collapse; font-size: .88rem; }
	.modal th, .modal td { text-align: left; padding: 7px 10px; border-bottom: 1px solid #2a2f3a; vertical-align: top; }
	.modal th { color: var(--muted); font-weight: 600; }
	.modal .tl { font-size: .84rem; color: var(--muted); }
	.modal .tl > div { padding: 3px 0; border-bottom: 1px solid #21252e; }
	.modal .tl b { color: var(--text); }
	.card .alertbadge {
		display: inline-block; margin-top: 6px; margin-right: 4px;
		background: rgba(239,68,68,0.16); color: #fca5a5;
		font-size: 0.7rem; font-weight: 700; padding: 2px 7px; border-radius: 5px;
	}
	.card.has-alert { border-left-color: var(--blocked); box-shadow: 0 0 0 1px rgba(239,68,68,.5), 0 2px 8px rgba(0,0,0,0.32); }
	header .alertchip {
		background: rgba(239,68,68,0.2); color: #fca5a5;
		font-weight: 700; padding: 4px 12px; border-radius: 999px; font-size: 0.9rem;
	}
	header .alertchip.zero { background: rgba(107,114,128,0.2); color: var(--muted); }
	.modal .kpis { display: flex; gap: 20px; flex-wrap: wrap; margin: 6px 0 4px; }
	.modal .kpis .kpi { font-size: .85rem; color: var(--muted); }
	.modal .kpis .kpi b { display: block; font-size: 1.3rem; color: var(--text); font-variant-numeric: tabular-nums; }
	.modal .toggle { display: inline-flex; gap: 0; margin-left: 10px; vertical-align: middle; }
	.modal .toggle button {
		background: rgba(255,255,255,0.06); color: var(--muted);
		border: 1px solid rgba(255,255,255,0.14); padding: 2px 10px;
		font-size: 0.72rem; cursor: pointer;
	}
	.modal .toggle button:first-child { border-radius: 5px 0 0 5px; }
	.modal .toggle button:last-child { border-radius: 0 5px 5px 0; border-left: none; }
	.modal .toggle button.on { background: rgba(59,130,246,0.25); color: var(--text); }
	.modal .grp { margin: 10px 0 4px; font-weight: 700; font-size: .82rem; color: #93c5fd; }
	header input[type=date] {
		background: var(--card-bg); color: var(--text);
		border: 1px solid rgba(255,255,255,0.18); border-radius: 6px;
		padding: 4px 8px; font-size: 0.85rem; color-scheme: dark;
	}
	header .livebtn {
		background: rgba(34,197,94,0.2); color: var(--working);
		border: none; border-radius: 6px; padding: 5px 12px; font-size: 0.8rem;
		font-weight: 700; cursor: pointer; display: none;
	}
	header .livebtn.show { display: inline-block; }
	.histnote {
		padding: 8px 24px 0; color: #fbbf24; font-size: 0.9rem; font-weight: 600;
	}
	.toolbar {
		display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
		padding: 14px 24px 0;
	}
	.toolbar a, .toolbar button {
		font-size: 0.82rem; text-decoration: none; cursor: pointer;
		border-radius: 6px; padding: 5px 12px; border: 1px solid rgba(255,255,255,0.16);
		background: rgba(255,255,255,0.06); color: var(--text);
	}
	.toolbar button.primary { background: rgba(59,130,246,0.28); border-color: transparent; font-weight: 700; }
	.toolbar a:hover, .toolbar button:hover { background: rgba(255,255,255,0.16); }
	.qform label { display: block; font-size: 0.8rem; color: var(--muted); margin: 10px 0 3px; }
	.qform select, .qform input, .qform textarea {
		width: 100%; background: var(--bg); color: var(--text);
		border: 1px solid rgba(255,255,255,0.18); border-radius: 6px; padding: 7px 9px;
		font-size: 0.9rem; color-scheme: dark;
	}
	.qform .row2 { display: flex; gap: 12px; }
	.qform .row2 > div { flex: 1; }
	.qform .actions { margin-top: 16px; display: flex; gap: 8px; }
	.qform .actions button {
		border: none; border-radius: 6px; padding: 8px 16px; font-weight: 700; cursor: pointer;
	}
	.qform .actions .save { background: var(--working); color: #06240f; }
	.qform .actions .cancel { background: rgba(255,255,255,0.1); color: var(--text); }
	.qform .msg { margin-top: 10px; font-size: 0.85rem; }
	.todaystrip {
		padding: 8px 24px 0; color: var(--muted); font-size: 0.85rem;
		display: flex; gap: 16px; flex-wrap: wrap;
	}
	.todaystrip b { color: var(--text); }
	.filterbar { padding: 12px 24px 0; display: flex; gap: 10px; flex-wrap: wrap; }
	.filterbar input, .filterbar select {
		background: var(--card-bg); color: var(--text);
		border: 1px solid rgba(255,255,255,0.16); border-radius: 7px;
		padding: 7px 11px; font-size: 0.88rem; color-scheme: dark;
	}
	.filterbar input { width: 260px; max-width: 100%; }
	.sess-view {
		background: transparent; border: 1px solid rgba(255,255,255,0.2); color: var(--muted);
		border-radius: 5px; padding: 2px 9px; font-size: 0.75rem; cursor: pointer;
	}
	.sess-view:hover { background: rgba(255,255,255,0.1); color: var(--text); }
	.sess-detail { background: rgba(255,255,255,0.03); }
	.sess-detail td { padding: 10px 14px !important; }
	.sess-detail .tl > div { padding: 3px 0; border-bottom: 1px solid #21252e; font-size: 0.82rem; color: var(--muted); }
	.sess-detail .tl b { color: var(--text); }
	.reflink { color: #93c5fd; text-decoration: none; }
	.reflink:hover { text-decoration: underline; }
</style>
</head>
<body>

<header>
	<h1>🟢 MM Employee Watcher</h1>
	<div style="display:flex;align-items:center;gap:12px;">
		<button class="livebtn" id="livebtn">&larr; Live</button>
		<input type="date" id="histdate" title="View a past day">
		<span class="alertchip zero" id="alertchip">0 alerts</span>
		<div class="clock" id="clock">--:--:--</div>
	</div>
</header>
<div class="histnote" id="histnote" style="display:none;"></div>

<div class="toolbar" id="toolbar" style="display:none;">
	<button class="primary" id="addqbtn">+ Add to queue</button>
	<a href="/app/employee-work-queue" target="_blank" rel="noopener">Work Queue &#8599;</a>
	<a href="/app/work-queue-schedule/new" target="_blank" rel="noopener">New Schedule &#8599;</a>
	<a href="/app/work-queue-schedule" target="_blank" rel="noopener">Schedules &#8599;</a>
	<a href="/app/work-activity-master" target="_blank" rel="noopener">Activities &#8599;</a>
</div>

<div class="counts" id="counts"></div>
<div class="todaystrip" id="todaystrip"></div>
<div class="filterbar">
	<input type="text" id="empfilter" placeholder="🔎 Search employee…">
	<select id="deptfilter"><option value="">All departments</option></select>
</div>
<div class="grid" id="grid"></div>
<div class="empty" id="empty" style="display:none;">No employees are being tracked right now.</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="overlay" id="qoverlay"><div class="modal" id="qmodal" style="width:min(460px,96vw);"></div></div>

<script>
window.csrf_token = "{{ csrf_token or '' }}";
</script>
<script>
var STATUS_LABEL = {
	WORKING: "Working",
	IDLE: "Idle",
	BREAK: "Break",
	BLOCKED: "Blocked",
	OFFLINE: "Offline",
	"OFF DUTY": "Off Duty"
};

function fmtMinutes(m) {
	if (m === null || m === undefined) return "";
	var sign = m < 0 ? "-" : "";
	m = Math.abs(m);
	var h = Math.floor(m / 60), mm = m % 60;
	return sign + (h > 0 ? h + "h " : "") + mm + "m";
}

function cardClass(status) {
	return (status || "").replace(" ", "");
}

function render(data) {
	var counts = data.counts || {};
	var countsEl = document.getElementById("counts");
	countsEl.innerHTML = "";
	Object.keys(STATUS_LABEL).forEach(function (key) {
		var n = counts[key] || 0;
		var pill = document.createElement("span");
		pill.className = "pill card " + cardClass(key);
		pill.style.borderLeft = "none";
		pill.textContent = STATUS_LABEL[key] + ": " + n;
		countsEl.appendChild(pill);
	});

	var alertN = data.open_alert_count || 0;
	var chip = document.getElementById("alertchip");
	chip.style.display = "";
	chip.textContent = alertN + (alertN === 1 ? " alert" : " alerts");
	chip.className = "alertchip" + (alertN ? "" : " zero");

	var tt = data.today_totals || {};
	document.getElementById("todaystrip").innerHTML =
		"Today: <b>" + (tt.created || 0) + "</b> created &middot; <b>" + (tt.submitted || 0) +
		"</b> submitted &middot; <b>" + (tt.reports || 0) + "</b> reports viewed";

	var grid = document.getElementById("grid");
	var empty = document.getElementById("empty");
	grid.innerHTML = "";

	if (!data.cards || !data.cards.length) {
		empty.style.display = "block";
		applyEmployeeFilter();
		return;
	}
	empty.style.display = "none";

	data.cards.forEach(function (c) {
		var el = document.createElement("div");
		var alerts = c.open_alerts || [];
		el.className = "card " + cardClass(c.status) + (alerts.length ? " has-alert" : "");
		el.setAttribute("data-employee", c.employee);
		el.setAttribute("data-department", c.department || "");

		var html = "";
		html += '<div class="top">';
		html += '<span class="name">' + escapeHtml(c.employee_name) + "</span>";
		html += '<span class="status">' + (STATUS_LABEL[c.status] || c.status) + "</span>";
		html += "</div>";

		alerts.forEach(function (a) {
			html += '<span class="alertbadge">⚠ ' + escapeHtml(a.type) +
				(a.reason ? ": " + escapeHtml(a.reason) : "") + "</span>";
		});

		if ((c.status === "WORKING" || c.status === "BLOCKED") && c.target_end_time) {
			html += '<div class="livetimer" data-end="' + escapeHtml(c.target_end_time) + '">--:--</div>';
		}

		if (c.work_activity) {
			html += '<div class="work">' + escapeHtml(c.work_activity) + "</div>";
			if (c.description) {
				html += '<div class="desc">' + escapeHtml(c.description) + "</div>";
			}
			if (c.reference_name) {
				html += '<div class="qty">' + escapeHtml(c.reference_doctype || "") + ": " + escapeHtml(c.reference_name) + "</div>";
			}
			if (c.target_qty) {
				html += '<div class="qty">' + (c.completed_qty || 0) + " / " + c.target_qty + " pcs</div>";
			}
		} else if (c.status === "IDLE") {
			html += '<div class="work">No active work</div>';
		}

		var footBits = [];
		if (c.status === "WORKING" || c.status === "BLOCKED") {
			if (c.extended_minutes) {
				footBits.push("extended " + c.extended_minutes + "m");
			}
		} else if (c.since_minutes !== undefined && c.since_minutes !== null) {
			footBits.push((STATUS_LABEL[c.status] || c.status) + " " + fmtMinutes(c.since_minutes));
		}

		if (c.queue_pending) {
			footBits.push(c.queue_pending + " pending");
		}
		if (footBits.length) {
			html += '<div class="footline"><span>' + footBits.join(" · ") + "</span></div>";
		}

		var tc = c.today_counts || {};
		var activityBits = [];
		if (tc["Document Created"]) activityBits.push(tc["Document Created"] + " created");
		if (tc["Document Submitted"]) activityBits.push(tc["Document Submitted"] + " submitted");
		if (tc["Report Viewed"]) activityBits.push(tc["Report Viewed"] + " reports");
		if (activityBits.length) {
			html += '<div class="activity-counts">Today: ' + activityBits.join(" · ") + "</div>";
		}

		if (c.status === "BLOCKED" && c.blocked_reason) {
			html += '<div class="reason">⚠ ' + escapeHtml(c.blocked_reason) + "</div>";
		}

		html += '<button class="viewbtn" data-view="' + escapeHtml(c.employee) + '">View day &rsaquo;</button>';

		el.innerHTML = html;
		grid.appendChild(el);
	});
	updateLiveTimers();
	applyEmployeeFilter();
}

// ---- name + department filter (client-side; survives the 30s re-render) ----
var _empFilter = "";
var _deptFilter = "";

function refreshDeptOptions() {
	var sel = document.getElementById("deptfilter");
	var cards = document.querySelectorAll("#grid .card");
	var seen = {};
	var depts = [];
	for (var i = 0; i < cards.length; i++) {
		var dep = cards[i].getAttribute("data-department");
		if (dep && !seen[dep]) { seen[dep] = true; depts.push(dep); }
	}
	depts.sort();
	var current = sel.value;
	sel.innerHTML = '<option value="">All departments</option>' +
		depts.map(function (d) { return '<option value="' + escapeHtml(d) + '">' + escapeHtml(d) + "</option>"; }).join("");
	if (depts.indexOf(current) > -1) sel.value = current;
}

function applyEmployeeFilter() {
	refreshDeptOptions();
	var q = _empFilter.trim().toLowerCase();
	var cards = document.querySelectorAll("#grid .card");
	for (var i = 0; i < cards.length; i++) {
		var name = (cards[i].querySelector(".name") || {}).textContent || "";
		var dep = cards[i].getAttribute("data-department") || "";
		var nameOk = !q || name.toLowerCase().indexOf(q) > -1;
		var deptOk = !_deptFilter || dep === _deptFilter;
		cards[i].style.display = (nameOk && deptOk) ? "" : "none";
	}
}
document.getElementById("empfilter").addEventListener("input", function () {
	_empFilter = this.value;
	applyEmployeeFilter();
});
document.getElementById("deptfilter").addEventListener("change", function () {
	_deptFilter = this.value;
	applyEmployeeFilter();
});

function countdownStr(endStr) {
	var d = new Date(String(endStr).replace(" ", "T"));
	if (isNaN(d)) return { text: "--:--", over: false };
	var s = Math.floor((d.getTime() - Date.now()) / 1000);
	var over = s < 0;
	s = Math.abs(s);
	var h = Math.floor(s / 3600);
	var m = String(Math.floor((s % 3600) / 60)).padStart(2, "0");
	var sec = String(s % 60).padStart(2, "0");
	return { text: (over ? "-" : "") + (h > 0 ? h + ":" : "") + m + ":" + sec, over: over };
}

function updateLiveTimers() {
	var nodes = document.querySelectorAll(".livetimer[data-end]");
	for (var i = 0; i < nodes.length; i++) {
		var c = countdownStr(nodes[i].getAttribute("data-end"));
		nodes[i].textContent = c.text;
		nodes[i].classList.toggle("over", c.over);
	}
}
setInterval(updateLiveTimers, 1000);

var _detailEmployee = null;

function fmtTime(dt) {
	if (!dt) return "—";
	var d = new Date(String(dt).replace(" ", "T"));
	return isNaN(d) ? "—" : d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}

function openDetail(employee, day) {
	_detailEmployee = employee;
	_activityView = "all";
	var modal = document.getElementById("modal");
	modal.innerHTML = '<span class="close" onclick="closeDetail()">&times;</span><p>Loading…</p>';
	document.getElementById("overlay").classList.add("show");

	var url = "/api/method/mm_employee_watcher.dashboard.get_employee_detail?employee=" + encodeURIComponent(employee);
	if (day) url += "&day=" + encodeURIComponent(day);
	fetch(url, {
		credentials: "same-origin",
		headers: { "X-Frappe-CSRF-Token": (window.csrf_token || ""), "Accept": "application/json" }
	})
		.then(function (r) { return r.json(); })
		.then(function (r) {
			if (_detailEmployee !== employee) return;
			if (r && r.message) renderDetail(r.message);
			else modal.innerHTML = '<span class="close" onclick="closeDetail()">&times;</span><p>Could not load this employee.</p>';
		})
		.catch(function () {
			modal.innerHTML = '<span class="close" onclick="closeDetail()">&times;</span><p>Could not reach the server.</p>';
		});
}

function closeDetail() {
	_detailEmployee = null;
	document.getElementById("overlay").classList.remove("show");
}

var _detailData = null;
var _activityView = "all";

function renderDetail(d) {
	_detailData = d;
	var h = '<span class="close" onclick="closeDetail()">&times;</span>';
	h += "<h2>" + escapeHtml(d.employee_name) + "</h2>";
	var isPast = d.day && d.day !== todayStr();
	h += '<div class="sub">' +
		(isPast ? d.day : (escapeHtml(STATUS_LABEL[d.status] || d.status || "") + " &middot; today")) +
		"</div>";

	h += '<div class="kpis">' +
		'<div class="kpi"><b>' + fmtMinutes(d.worked_minutes) + "</b>worked</div>" +
		'<div class="kpi"><b>' + fmtMinutes(d.idle_minutes || 0) + "</b>idle</div>" +
		'<div class="kpi"><b>' + fmtMinutes(d.break_minutes || 0) + "</b>break</div>" +
		'<div class="kpi"><b>' + fmtMinutes(d.blocked_minutes || 0) + "</b>blocked</div>" +
		'<div class="kpi"><b>' + d.session_count + "</b>work sessions</div>" +
		"</div>";

	if ((d.alerts && d.alerts.length) || (d.blocked_reasons && d.blocked_reasons.length)) {
		h += '<div class="sec-title">Alerts &amp; blockers</div><div class="tl">';
		(d.alerts || []).forEach(function (a) {
			h += "<div>" + fmtTime(a.raised_at) + " — <b>⚠ " + escapeHtml(a.alert_type) + "</b>" +
				(a.reason ? " &middot; " + escapeHtml(a.reason) : "") +
				" &middot; " + (a.status === "Open" ? "still open" : (fmtMinutes(a.open_minutes || 0) + " long")) + "</div>";
		});
		(d.blocked_reasons || []).forEach(function (b) {
			h += "<div>Blocked " + fmtMinutes(b.minutes) + " — " + escapeHtml(b.reason) + "</div>";
		});
		if (!(d.alerts && d.alerts.length) && !(d.blocked_reasons && d.blocked_reasons.length)) {
			h += "<div>None.</div>";
		}
		h += "</div>";
	}

	h += '<div class="sec-title">Work sessions</div>';
	h += "<table><tr><th>Time</th><th>Activity</th><th>What they did</th><th>Qty</th><th>Status</th><th></th></tr>";
	(d.sessions || []).forEach(function (s) {
		var endTxt = s.actual_end_time ? fmtTime(s.actual_end_time) : (s.ongoing ? "now" : "—");
		var dur = s.minutes != null ? " (" + fmtMinutes(s.minutes) + ")" : "";
		var ref = s.reference_name
			? '<br><span class="tl">' + refLink(s.reference_doctype, s.reference_name) + "</span>"
			: "";
		h += "<tr><td>" + fmtTime(s.start_time) + " – " + endTxt + dur + "</td>" +
			"<td>" + escapeHtml(s.work_activity || "") + "</td>" +
			"<td>" + escapeHtml(s.description || "") + ref + "</td>" +
			"<td>" + (s.completed_qty || 0) + (s.target_qty ? " / " + s.target_qty : "") + "</td>" +
			"<td>" + escapeHtml(s.status || "") + "</td>" +
			'<td><button class="sess-view" data-sess="' + escapeHtml(s.name) + '">View</button></td></tr>';
		h += '<tr class="sess-detail" id="sd-' + escapeHtml(s.name) + '" style="display:none;"><td colspan="6"></td></tr>';
	});
	if (!d.sessions || !d.sessions.length) h += '<tr><td colspan="6" class="tl">No work sessions today.</td></tr>';
	h += "</table>";

	h += '<div class="sec-title">Activity log' +
		'<span class="toggle">' +
		'<button data-av="all" class="' + (_activityView === "all" ? "on" : "") + '">All</button>' +
		'<button data-av="session" class="' + (_activityView === "session" ? "on" : "") + '">By work session</button>' +
		"</span></div>";
	h += '<div id="activitybox" class="tl">' + activityHtml(d) + "</div>";

	document.getElementById("modal").innerHTML = h;

	var tog = document.querySelectorAll("#modal .toggle button");
	for (var i = 0; i < tog.length; i++) {
		tog[i].addEventListener("click", function () {
			_activityView = this.getAttribute("data-av");
			for (var j = 0; j < tog.length; j++) tog[j].classList.toggle("on", tog[j] === this);
			document.getElementById("activitybox").innerHTML = activityHtml(_detailData);
		});
	}

	document.querySelectorAll("#modal .sess-view").forEach(function (btn) {
		btn.addEventListener("click", function () {
			var name = this.getAttribute("data-sess");
			var row = document.getElementById("sd-" + name);
			if (!row) return;
			var open = row.style.display !== "none";
			if (open) {
				row.style.display = "none";
				this.textContent = "View";
			} else {
				row.querySelector("td").innerHTML = sessionDetailHtml(name);
				row.style.display = "";
				this.textContent = "Hide";
			}
		});
	});
}

function sessionDetailHtml(sessName) {
	var d = _detailData || {};
	var s = (d.sessions || []).find(function (x) { return x.name === sessName; });
	var mylogs = (d.logs || [])
		.filter(function (l) { return l.work_session === sessName; })
		.sort(function (a, b) { return a.event_time < b.event_time ? -1 : 1; });

	var h = '<div class="tl">';
	if (s) {
		h += "<div><b>" + escapeHtml(s.work_activity || "") + "</b> &middot; " + escapeHtml(s.status || "") +
			(s.source_app ? " &middot; " + escapeHtml(s.source_app) : "") +
			(s.extended_minutes ? " &middot; extended " + s.extended_minutes + "m" : "") + "</div>";
		if (s.reference_name) {
			h += "<div>Reference: " + refLink(s.reference_doctype, s.reference_name) + "</div>";
		}
	}
	if (!mylogs.length) {
		h += "<div>No log entries tied to this session.</div>";
	} else {
		h += mylogs.map(logLine).join("");
	}
	h += "</div>";
	return h;
}

function refLink(doctype, name) {
	if (!name) return "";
	var slug = String(doctype || "").toLowerCase().replace(/ /g, "-");
	return '<a class="reflink" target="_blank" rel="noopener" href="/app/' +
		encodeURIComponent(slug) + "/" + encodeURIComponent(name) + '">' +
		escapeHtml(doctype || "") + " " + escapeHtml(name) + "</a>";
}

function logLine(l) {
	return "<div>" + fmtTime(l.event_time) + " — <b>" + escapeHtml(l.event_type) + "</b>" +
		(l.reference_name ? " &middot; " + refLink(l.reference_doctype, l.reference_name) : "") +
		(l.remarks ? " &middot; " + escapeHtml(l.remarks) : "") +
		(l.qty ? " &middot; qty " + l.qty : "") + "</div>";
}

function activityHtml(d) {
	var logs = d.logs || [];
	if (!logs.length) return "<div>No events logged today.</div>";

	if (_activityView === "all") {
		return logs.map(logLine).join("");
	}

	// group by work session
	var asc = logs.slice().sort(function (a, b) { return a.event_time < b.event_time ? -1 : 1; });
	var byS = {};
	asc.forEach(function (l) {
		var k = l.work_session || "_none";
		(byS[k] = byS[k] || []).push(l);
	});
	var out = "";
	(d.sessions || []).forEach(function (s) {
		if (!byS[s.name]) return;
		out += '<div class="grp">' + fmtTime(s.start_time) + " · " + escapeHtml(s.work_activity || "") +
			(s.description ? " — " + escapeHtml(s.description) : "") + "</div>";
		out += byS[s.name].map(logLine).join("");
		delete byS[s.name];
	});
	// leftover sessions not in d.sessions, then the no-session bucket
	Object.keys(byS).forEach(function (k) {
		out += '<div class="grp">' + (k === "_none" ? "No work session (break / navigation)" : escapeHtml(k)) + "</div>";
		out += byS[k].map(logLine).join("");
	});
	return out;
}

document.getElementById("grid").addEventListener("click", function (e) {
	var card = e.target.closest(".card");
	if (card && card.getAttribute("data-employee")) {
		openDetail(card.getAttribute("data-employee"), _histDay || null);
	}
});
document.getElementById("overlay").addEventListener("click", function (e) {
	if (e.target === this) closeDetail();
});
document.addEventListener("keydown", function (e) {
	if (e.key === "Escape") { closeDetail(); closeAddQueue(); }
});

function escapeHtml(s) {
	if (!s) return "";
	return s.replace(/[&<>"']/g, function (m) {
		return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m];
	});
}

var _histDay = null;

function todayStr() {
	var d = new Date();
	return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function fetchData() {
	if (_histDay) return; // history mode is not auto-refreshed
	fetch("/api/method/mm_employee_watcher.dashboard.get_dashboard_data", {
		credentials: "same-origin",
		headers: {
			"X-Frappe-CSRF-Token": (window.csrf_token || ""),
			"Accept": "application/json"
		}
	})
		.then(function (r) {
			var contentType = r.headers.get("content-type") || "";

			// Not logged in (or session expired) usually comes back as the
			// login page's HTML, not a 403 — catch that before trying to
			// parse it as JSON.
			if (!contentType.includes("application/json")) {
				window.location.href = "/login?redirect-to=/mm_dashboard";
				return null;
			}
			return r.json();
		})
		.then(function (r) {
			if (!r) return;
			if (r.message) {
				render(r.message);
			} else if (r.exc || r.exception) {
				showError("Server error — check the site's error log. " + (r.exception || ""));
			}
		})
		.catch(function (e) {
			console.error("mm_dashboard fetch failed", e);
			showError("Could not reach the server. Retrying in 30s...");
		});
}

function showError(msg) {
	var empty = document.getElementById("empty");
	empty.textContent = msg;
	empty.style.display = "block";
}

// ---- history (back-dated) mode ----

function fetchHistory(day) {
	fetch("/api/method/mm_employee_watcher.dashboard.get_dashboard_history?day=" + encodeURIComponent(day), {
		credentials: "same-origin",
		headers: { "X-Frappe-CSRF-Token": (window.csrf_token || ""), "Accept": "application/json" }
	})
		.then(function (r) { return r.json(); })
		.then(function (r) {
			if (r && r.message) renderHistory(r.message);
			else showError("Could not load that day.");
		})
		.catch(function () { showError("Could not reach the server."); });
}

function renderHistory(data) {
	document.getElementById("counts").innerHTML = "";
	document.getElementById("alertchip").style.display = "none";
	document.getElementById("todaystrip").innerHTML = "";
	var grid = document.getElementById("grid");
	var empty = document.getElementById("empty");
	grid.innerHTML = "";
	var cards = data.cards || [];
	if (!cards.length) {
		empty.textContent = "No tracked activity on " + data.day + ".";
		empty.style.display = "block";
		applyEmployeeFilter();
		return;
	}
	empty.style.display = "none";
	cards.forEach(function (c) {
		var el = document.createElement("div");
		el.className = "card WORKING";
		el.setAttribute("data-employee", c.employee);
		el.setAttribute("data-department", c.department || "");
		var html = '<div class="top"><span class="name">' + escapeHtml(c.employee_name) + "</span></div>";
		html += '<div class="livetimer">' + fmtMinutes(c.worked_minutes) + "</div>";
		html += '<div class="desc">worked · ' + c.sessions + " sessions" + (c.qty ? " · " + c.qty + " qty" : "") + "</div>";
		var bits = [];
		if (c.idle_minutes) bits.push(fmtMinutes(c.idle_minutes) + " idle");
		if (c.break_minutes) bits.push(fmtMinutes(c.break_minutes) + " break");
		if (c.blocked_minutes) bits.push('<span class="over">' + fmtMinutes(c.blocked_minutes) + " blocked</span>");
		if (bits.length) html += '<div class="footline"><span>' + bits.join(" · ") + "</span></div>";
		html += '<button class="viewbtn" data-view="' + escapeHtml(c.employee) + '">View day &rsaquo;</button>';
		el.innerHTML = html;
		grid.appendChild(el);
	});
	applyEmployeeFilter();
}

function setHistory(day) {
	if (!day || day === todayStr()) {
		_histDay = null;
		document.getElementById("histdate").value = "";
		document.getElementById("livebtn").classList.remove("show");
		document.getElementById("histnote").style.display = "none";
		document.getElementById("alertchip").style.display = "";
		fetchData();
		return;
	}
	_histDay = day;
	document.getElementById("livebtn").classList.add("show");
	var note = document.getElementById("histnote");
	note.textContent = "Showing history for " + day + " — cards are that day's totals, not live status.";
	note.style.display = "block";
	fetchHistory(day);
}

document.getElementById("histdate").max = todayStr();
document.getElementById("histdate").addEventListener("change", function () {
	setHistory(this.value);
});
document.getElementById("livebtn").addEventListener("click", function () {
	setHistory(null);
});

// ---- add-to-queue ----

var _queueForm = null;

function api(method, params) {
	var url = "/api/method/" + method;
	var opts = {
		method: "POST",
		credentials: "same-origin",
		headers: {
			"X-Frappe-CSRF-Token": (window.csrf_token || ""),
			"Accept": "application/json",
			"Content-Type": "application/json"
		},
		body: JSON.stringify(params || {})
	};
	return fetch(url, opts).then(function (r) { return r.json(); });
}

api("mm_employee_watcher.dashboard.get_queue_form_data")
	.then(function (r) {
		if (r && r.message && r.message.employees) {
			_queueForm = r.message;
			document.getElementById("toolbar").style.display = "flex";
		}
	})
	.catch(function () {});

function openAddQueue() {
	if (!_queueForm) return;
	var emps = _queueForm.employees.map(function (e) {
		return '<option value="' + escapeHtml(e.name) + '">' + escapeHtml(e.employee_name || e.name) +
			(e.department ? " — " + escapeHtml(e.department) : "") + "</option>";
	}).join("");
	var acts = _queueForm.activities.map(function (a) {
		return '<option value="' + escapeHtml(a.name) + '">' + escapeHtml(a.name) + "</option>";
	}).join("");
	document.getElementById("qmodal").innerHTML =
		'<span class="close" onclick="closeAddQueue()">&times;</span>' +
		"<h2>Add to queue</h2>" +
		'<div class="qform">' +
		"<label>Employee</label><select id=\"q_emp\">" + emps + "</select>" +
		"<label>Work activity</label><select id=\"q_act\">" + acts + "</select>" +
		"<label>Instructions</label><textarea id=\"q_ins\" rows=\"2\" placeholder=\"What exactly to do\"></textarea>" +
		'<div class="row2">' +
		"<div><label>Target qty</label><input id=\"q_qty\" type=\"number\" min=\"0\" step=\"any\"></div>" +
		"<div><label>Priority</label><input id=\"q_pri\" type=\"number\" value=\"0\"></div>" +
		"</div>" +
		"<label>For date</label><input id=\"q_date\" type=\"date\" value=\"" + todayStr() + "\">" +
		'<div class="msg" id="q_msg"></div>' +
		'<div class="actions">' +
		'<button class="save" onclick="submitAddQueue()">Add task</button>' +
		'<button class="cancel" onclick="closeAddQueue()">Cancel</button>' +
		"</div></div>";
	document.getElementById("qoverlay").classList.add("show");
}

function closeAddQueue() {
	document.getElementById("qoverlay").classList.remove("show");
}

function submitAddQueue() {
	var msg = document.getElementById("q_msg");
	msg.textContent = "Saving…";
	api("mm_employee_watcher.dashboard.add_queue_item", {
		employee: document.getElementById("q_emp").value,
		work_activity: document.getElementById("q_act").value,
		instructions: document.getElementById("q_ins").value,
		target_qty: document.getElementById("q_qty").value || null,
		priority: document.getElementById("q_pri").value || 0,
		for_date: document.getElementById("q_date").value || null
	}).then(function (r) {
		if (r && r.message && r.message.ok) {
			closeAddQueue();
			if (!_histDay) fetchData();
		} else {
			msg.textContent = (r && (r._server_messages || r.exception)) ? "Could not add — check the values." : "Failed.";
		}
	}).catch(function () { msg.textContent = "Could not reach the server."; });
}

document.getElementById("addqbtn").addEventListener("click", openAddQueue);
document.getElementById("qoverlay").addEventListener("click", function (e) {
	if (e.target === this) closeAddQueue();
});

function tickClock() {
	document.getElementById("clock").textContent = new Date().toLocaleTimeString();
}

tickClock();
setInterval(tickClock, 1000);

fetchData();
setInterval(fetchData, 30000); // live dashboard refreshes every 30s
</script>

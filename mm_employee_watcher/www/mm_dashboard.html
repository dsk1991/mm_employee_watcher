<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MM Employee Watcher — Live Dashboard</title>
<meta http-equiv="refresh-not-used" content="">
<style>
	:root {
		--bg: #0f1115;
		--card-bg: #1a1d24;
		--text: #f2f3f5;
		--muted: #9aa0ab;
		--working: #22c55e;
		--idle: #6b7280;
		--break: #3b82f6;
		--blocked: #ef4444;
		--offline: #374151;
	}
	* { box-sizing: border-box; }
	body {
		margin: 0;
		background: var(--bg);
		color: var(--text);
		font-family: "Segoe UI", Roboto, -apple-system, Arial, sans-serif;
		min-height: 100vh;
	}
	header {
		display: flex;
		align-items: center;
		justify-content: space-between;
		padding: 13px 24px;
		border-bottom: 2px solid #262a33;
	}
	header h1 {
		margin: 0;
		font-size: 1.2rem;
		letter-spacing: 0.5px;
	}
	header .clock {
		font-size: 1.1rem;
		color: var(--muted);
		font-variant-numeric: tabular-nums;
	}
	.counts {
		display: flex;
		gap: 14px;
		padding: 16px 32px 0;
		flex-wrap: wrap;
	}
	.pill {
		padding: 8px 18px;
		border-radius: 999px;
		font-weight: 600;
		font-size: 1rem;
	}
	.grid {
		display: grid;
		grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
		gap: 12px;
		padding: 18px 24px 40px;
	}
	.card {
		background: var(--card-bg);
		border-radius: 10px;
		padding: 11px 13px;
		border-left: 5px solid var(--idle);
		box-shadow: 0 2px 8px rgba(0,0,0,0.32);
		font-size: 0.85rem;
	}
	.card.WORKING { border-left-color: var(--working); }
	.card.IDLE { border-left-color: var(--idle); }
	.card.BREAK { border-left-color: var(--break); }
	.card.BLOCKED { border-left-color: var(--blocked); }
	.card.OFFLINE, .card.OFFDUTY { border-left-color: var(--offline); }

	.card .top {
		display: flex;
		justify-content: space-between;
		align-items: baseline;
		margin-bottom: 6px;
	}
	.card .name {
		font-size: 1rem;
		font-weight: 700;
	}
	.card .status {
		font-size: 0.68rem;
		font-weight: 700;
		letter-spacing: 0.5px;
		padding: 2px 7px;
		border-radius: 5px;
		text-transform: uppercase;
	}
	.card .livetimer {
		font-variant-numeric: tabular-nums;
		font-weight: 700;
		font-size: 1.15rem;
		margin: 4px 0 2px;
	}
	.card .livetimer.over { color: var(--blocked); }
	.card .viewbtn {
		margin-top: 9px;
		background: rgba(255,255,255,0.08);
		color: var(--text);
		border: 1px solid rgba(255,255,255,0.16);
		border-radius: 6px;
		padding: 3px 12px;
		font-size: 0.75rem;
		cursor: pointer;
	}
	.card .viewbtn:hover { background: rgba(255,255,255,0.16); }
	.card.WORKING .status { background: rgba(34,197,94,0.18); color: var(--working); }
	.card.IDLE .status { background: rgba(107,114,128,0.25); color: #d1d5db; }
	.card.BREAK .status { background: rgba(59,130,246,0.18); color: var(--break); }
	.card.BLOCKED .status { background: rgba(239,68,68,0.18); color: var(--blocked); }
	.card.OFFLINE .status, .card.OFFDUTY .status { background: rgba(55,65,81,0.4); color: var(--muted); }

	.card .work {
		font-size: 0.92rem;
		font-weight: 600;
		margin: 6px 0 2px;
	}
	.card .desc {
		color: var(--muted);
		font-size: 0.8rem;
		margin: 2px 0 4px;
	}
	.card .activity-counts {
		color: var(--muted);
		font-size: 0.75rem;
		margin-top: 6px;
	}
	.card .qty {
		color: var(--muted);
		font-size: 0.8rem;
	}
	.card .footline {
		margin-top: 6px;
		font-size: 0.78rem;
		color: var(--muted);
		display: flex;
		justify-content: space-between;
	}
	.card .footline .warn { color: #fbbf24; font-weight: 600; }
	.card .footline .over { color: var(--blocked); font-weight: 700; }
	.card .reason {
		margin-top: 8px;
		font-size: 0.9rem;
		color: #fca5a5;
	}
	.empty {
		padding: 60px 32px;
		text-align: center;
		color: var(--muted);
		font-size: 1.2rem;
	}
	.card { cursor: pointer; transition: transform .08s ease; }
	.card:hover { transform: translateY(-2px); }
	.overlay {
		position: fixed; inset: 0; background: rgba(0,0,0,.62);
		display: none; z-index: 60; padding: 24px;
	}
	.overlay.show { display: flex; }
	.modal {
		background: var(--card-bg); margin: auto; width: min(920px, 96vw);
		max-height: 88vh; overflow-y: auto; border-radius: 14px;
		padding: 22px 26px; box-shadow: 0 20px 60px rgba(0,0,0,.55);
	}
	.modal .close { float: right; cursor: pointer; font-size: 1.7rem; color: var(--muted); line-height: 1; }
	.modal h2 { margin: 0 0 4px; }
	.modal .sub { color: var(--muted); margin-bottom: 14px; }
	.modal .sec-title { font-size: 1rem; font-weight: 700; margin: 18px 0 6px; }
	.modal table { width: 100%; border-collapse: collapse; font-size: .88rem; }
	.modal th, .modal td { text-align: left; padding: 7px 10px; border-bottom: 1px solid #2a2f3a; vertical-align: top; }
	.modal th { color: var(--muted); font-weight: 600; }
	.modal .tl { font-size: .84rem; color: var(--muted); }
	.modal .tl > div { padding: 3px 0; border-bottom: 1px solid #21252e; }
	.modal .tl b { color: var(--text); }
</style>
</head>
<body>

<header>
	<h1>🟢 MM Employee Watcher</h1>
	<div class="clock" id="clock">--:--:--</div>
</header>

<div class="counts" id="counts"></div>
<div class="grid" id="grid"></div>
<div class="empty" id="empty" style="display:none;">No employees are being tracked right now.</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

<script>
window.csrf_token = "{{ csrf_token or '' }}";
</script>
<script>
var STATUS_LABEL = {
	WORKING: "Working",
	IDLE: "Idle",
	BREAK: "Break",
	BLOCKED: "Blocked",
	OFFLINE: "Offline",
	"OFF DUTY": "Off Duty"
};

function fmtMinutes(m) {
	if (m === null || m === undefined) return "";
	var sign = m < 0 ? "-" : "";
	m = Math.abs(m);
	var h = Math.floor(m / 60), mm = m % 60;
	return sign + (h > 0 ? h + "h " : "") + mm + "m";
}

function cardClass(status) {
	return (status || "").replace(" ", "");
}

function render(data) {
	var counts = data.counts || {};
	var countsEl = document.getElementById("counts");
	countsEl.innerHTML = "";
	Object.keys(STATUS_LABEL).forEach(function (key) {
		var n = counts[key] || 0;
		var pill = document.createElement("span");
		pill.className = "pill card " + cardClass(key);
		pill.style.borderLeft = "none";
		pill.textContent = STATUS_LABEL[key] + ": " + n;
		countsEl.appendChild(pill);
	});

	var grid = document.getElementById("grid");
	var empty = document.getElementById("empty");
	grid.innerHTML = "";

	if (!data.cards || !data.cards.length) {
		empty.style.display = "block";
		return;
	}
	empty.style.display = "none";

	data.cards.forEach(function (c) {
		var el = document.createElement("div");
		el.className = "card " + cardClass(c.status);
		el.setAttribute("data-employee", c.employee);

		var html = "";
		html += '<div class="top">';
		html += '<span class="name">' + escapeHtml(c.employee_name) + "</span>";
		html += '<span class="status">' + (STATUS_LABEL[c.status] || c.status) + "</span>";
		html += "</div>";

		if ((c.status === "WORKING" || c.status === "BLOCKED") && c.target_end_time) {
			html += '<div class="livetimer" data-end="' + escapeHtml(c.target_end_time) + '">--:--</div>';
		}

		if (c.work_activity) {
			html += '<div class="work">' + escapeHtml(c.work_activity) + "</div>";
			if (c.description) {
				html += '<div class="desc">' + escapeHtml(c.description) + "</div>";
			}
			if (c.reference_name) {
				html += '<div class="qty">' + escapeHtml(c.reference_doctype || "") + ": " + escapeHtml(c.reference_name) + "</div>";
			}
			if (c.target_qty) {
				html += '<div class="qty">' + (c.completed_qty || 0) + " / " + c.target_qty + " pcs</div>";
			}
		} else if (c.status === "IDLE") {
			html += '<div class="work">No active work</div>';
		}

		var footBits = [];
		if (c.status === "WORKING" || c.status === "BLOCKED") {
			if (c.extended_minutes) {
				footBits.push("extended " + c.extended_minutes + "m");
			}
		} else if (c.since_minutes !== undefined && c.since_minutes !== null) {
			footBits.push((STATUS_LABEL[c.status] || c.status) + " " + fmtMinutes(c.since_minutes));
		}

		if (footBits.length) {
			html += '<div class="footline"><span>' + footBits.join(" · ") + "</span></div>";
		}

		var tc = c.today_counts || {};
		var activityBits = [];
		if (tc["Document Created"]) activityBits.push(tc["Document Created"] + " created");
		if (tc["Document Submitted"]) activityBits.push(tc["Document Submitted"] + " submitted");
		if (tc["Report Viewed"]) activityBits.push(tc["Report Viewed"] + " reports");
		if (activityBits.length) {
			html += '<div class="activity-counts">Today: ' + activityBits.join(" · ") + "</div>";
		}

		if (c.status === "BLOCKED" && c.blocked_reason) {
			html += '<div class="reason">⚠ ' + escapeHtml(c.blocked_reason) + "</div>";
		}

		html += '<button class="viewbtn" data-view="' + escapeHtml(c.employee) + '">View day &rsaquo;</button>';

		el.innerHTML = html;
		grid.appendChild(el);
	});
	updateLiveTimers();
}

function countdownStr(endStr) {
	var d = new Date(String(endStr).replace(" ", "T"));
	if (isNaN(d)) return { text: "--:--", over: false };
	var s = Math.floor((d.getTime() - Date.now()) / 1000);
	var over = s < 0;
	s = Math.abs(s);
	var h = Math.floor(s / 3600);
	var m = String(Math.floor((s % 3600) / 60)).padStart(2, "0");
	var sec = String(s % 60).padStart(2, "0");
	return { text: (over ? "-" : "") + (h > 0 ? h + ":" : "") + m + ":" + sec, over: over };
}

function updateLiveTimers() {
	var nodes = document.querySelectorAll(".livetimer[data-end]");
	for (var i = 0; i < nodes.length; i++) {
		var c = countdownStr(nodes[i].getAttribute("data-end"));
		nodes[i].textContent = c.text;
		nodes[i].classList.toggle("over", c.over);
	}
}
setInterval(updateLiveTimers, 1000);

var _detailEmployee = null;

function fmtTime(dt) {
	if (!dt) return "—";
	var d = new Date(String(dt).replace(" ", "T"));
	return isNaN(d) ? "—" : d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}

function openDetail(employee) {
	_detailEmployee = employee;
	var modal = document.getElementById("modal");
	modal.innerHTML = '<span class="close" onclick="closeDetail()">&times;</span><p>Loading…</p>';
	document.getElementById("overlay").classList.add("show");

	fetch("/api/method/mm_employee_watcher.dashboard.get_employee_detail?employee=" + encodeURIComponent(employee), {
		credentials: "same-origin",
		headers: { "X-Frappe-CSRF-Token": (window.csrf_token || ""), "Accept": "application/json" }
	})
		.then(function (r) { return r.json(); })
		.then(function (r) {
			if (_detailEmployee !== employee) return;
			if (r && r.message) renderDetail(r.message);
			else modal.innerHTML = '<span class="close" onclick="closeDetail()">&times;</span><p>Could not load this employee.</p>';
		})
		.catch(function () {
			modal.innerHTML = '<span class="close" onclick="closeDetail()">&times;</span><p>Could not reach the server.</p>';
		});
}

function closeDetail() {
	_detailEmployee = null;
	document.getElementById("overlay").classList.remove("show");
}

function renderDetail(d) {
	var h = '<span class="close" onclick="closeDetail()">&times;</span>';
	h += "<h2>" + escapeHtml(d.employee_name) + "</h2>";
	h += '<div class="sub">' + escapeHtml(STATUS_LABEL[d.status] || d.status || "") +
		" &middot; " + fmtMinutes(d.worked_minutes) + " worked today &middot; " +
		d.session_count + " work session" + (d.session_count === 1 ? "" : "s") + "</div>";

	h += '<div class="sec-title">Work sessions</div>';
	h += "<table><tr><th>Time</th><th>Activity</th><th>What they did</th><th>Qty</th><th>Status</th></tr>";
	(d.sessions || []).forEach(function (s) {
		var endTxt = s.actual_end_time ? fmtTime(s.actual_end_time) : (s.ongoing ? "now" : "—");
		var dur = s.minutes != null ? " (" + fmtMinutes(s.minutes) + ")" : "";
		var ref = s.reference_name
			? '<br><span class="tl">' + escapeHtml(s.reference_doctype || "") + ": " + escapeHtml(s.reference_name) + "</span>"
			: "";
		h += "<tr><td>" + fmtTime(s.start_time) + " – " + endTxt + dur + "</td>" +
			"<td>" + escapeHtml(s.work_activity || "") + "</td>" +
			"<td>" + escapeHtml(s.description || "") + ref + "</td>" +
			"<td>" + (s.completed_qty || 0) + (s.target_qty ? " / " + s.target_qty : "") + "</td>" +
			"<td>" + escapeHtml(s.status || "") + "</td></tr>";
	});
	if (!d.sessions || !d.sessions.length) h += '<tr><td colspan="5" class="tl">No work sessions today.</td></tr>';
	h += "</table>";

	h += '<div class="sec-title">Activity log</div><div class="tl">';
	(d.logs || []).forEach(function (l) {
		h += "<div>" + fmtTime(l.event_time) + " — <b>" + escapeHtml(l.event_type) + "</b>" +
			(l.reference_name ? " &middot; " + escapeHtml(l.reference_doctype || "") + " " + escapeHtml(l.reference_name) : "") +
			(l.remarks ? " &middot; " + escapeHtml(l.remarks) : "") +
			(l.qty ? " &middot; qty " + l.qty : "") + "</div>";
	});
	if (!d.logs || !d.logs.length) h += "<div>No events logged today.</div>";
	h += "</div>";

	document.getElementById("modal").innerHTML = h;
}

document.getElementById("grid").addEventListener("click", function (e) {
	var card = e.target.closest(".card");
	if (card && card.getAttribute("data-employee")) openDetail(card.getAttribute("data-employee"));
});
document.getElementById("overlay").addEventListener("click", function (e) {
	if (e.target === this) closeDetail();
});
document.addEventListener("keydown", function (e) {
	if (e.key === "Escape") closeDetail();
});

function escapeHtml(s) {
	if (!s) return "";
	return s.replace(/[&<>"']/g, function (m) {
		return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m];
	});
}

function fetchData() {
	fetch("/api/method/mm_employee_watcher.dashboard.get_dashboard_data", {
		credentials: "same-origin",
		headers: {
			"X-Frappe-CSRF-Token": (window.csrf_token || ""),
			"Accept": "application/json"
		}
	})
		.then(function (r) {
			var contentType = r.headers.get("content-type") || "";

			// Not logged in (or session expired) usually comes back as the
			// login page's HTML, not a 403 — catch that before trying to
			// parse it as JSON.
			if (!contentType.includes("application/json")) {
				window.location.href = "/login?redirect-to=/mm_dashboard";
				return null;
			}
			return r.json();
		})
		.then(function (r) {
			if (!r) return;
			if (r.message) {
				render(r.message);
			} else if (r.exc || r.exception) {
				showError("Server error — check the site's error log. " + (r.exception || ""));
			}
		})
		.catch(function (e) {
			console.error("mm_dashboard fetch failed", e);
			showError("Could not reach the server. Retrying in 30s...");
		});
}

function showError(msg) {
	var empty = document.getElementById("empty");
	empty.textContent = msg;
	empty.style.display = "block";
}

function tickClock() {
	document.getElementById("clock").textContent = new Date().toLocaleTimeString();
}

tickClock();
setInterval(tickClock, 1000);

fetchData();
setInterval(fetchData, 30000); // requirement: refresh every 30 seconds
</script>

</body>
</html>

name: Static validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python source
        run: python -m compileall -q mm_employee_watcher tests
      - name: Run dependency-free tests
        run: python -m unittest discover -s tests -v
      - name: Validate Desk JavaScript syntax
        run: node --check mm_employee_watcher/public/js/mm_watcher.js

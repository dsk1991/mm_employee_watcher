[project]
name = "mm_employee_watcher"
authors = [
    { name = "Modern Marwar", email = "dileepsinghkheechee@gmail.com" }
]
description = "Smart Employee Work Watcher for Frappe / ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.dev-dependencies]

# Required by Frappe Cloud / bench to resolve a compatible Frappe version
# for this app. See https://docs.frappe.io/cloud/benches/custom-app#note
[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
